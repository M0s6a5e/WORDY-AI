<svg xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 2000 2000" role="img" aria-labelledby="title desc">
  <title id="title">Morning Jo'</title>
  <desc id="desc">Illustration of a glass coffee pot with a cute and smiling kawaii face, drawn by Alvaro Montoro</desc>
  <style>
    .shadow {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: shadow-pulse 0.45s ease-in-out infinite;
    }
    @keyframes shadow-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(0.9, 1); }
    }

    .character {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: walk-bob 0.45s ease-in-out infinite;
    }
    @keyframes walk-bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-16px); }
    }

    .leg-left {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: leg-left-swing 0.9s ease-in-out infinite;
    }
    .leg-right {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: leg-right-swing 0.9s ease-in-out infinite;
    }
    @keyframes leg-left-swing {
      0%, 100% { transform: rotate(-16deg); }
      50%      { transform: rotate(16deg); }
    }
    @keyframes leg-right-swing {
      0%, 100% { transform: rotate(16deg); }
      50%      { transform: rotate(-16deg); }
    }

    .arm-left {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: arm-left-swing 0.9s ease-in-out infinite;
    }
    .arm-right {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: arm-right-swing 0.9s ease-in-out infinite;
    }
    @keyframes arm-left-swing {
      0%, 100% { transform: rotate(12deg); }
      50%      { transform: rotate(-12deg); }
    }
    @keyframes arm-right-swing {
      0%, 100% { transform: rotate(-12deg); }
      50%      { transform: rotate(12deg); }
    }

    .eyes {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: blink 4.8s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 88%, 100% { transform: scaleY(1); }
      92%, 96%      { transform: scaleY(0.1); }
    }

    .liquid {
      transform-box: fill-box;
      transform-origin: 50% 65%;
      animation: slosh 0.45s ease-in-out infinite;
      animation-delay: 0.06s;
    }
    @keyframes slosh {
      0%   { transform: skewX(0deg) rotate(0deg) translateY(0); }
      20%  { transform: skewX(-7deg) rotate(-2deg) translateY(3px); }
      50%  { transform: skewX(5deg) rotate(2deg) translateY(-4px); }
      80%  { transform: skewX(-3deg) rotate(-1deg) translateY(2px); }
      100% { transform: skewX(0deg) rotate(0deg) translateY(0); }
    }
  </style>
  <defs>
    <clipPath id="bowl-clip">
      <path d="M 860,544 C 599,655 614,874 635,977 656,1081 718,1174 817,1216 923,1217 1091,1213 1156,1213 1265,1180 1358,1081 1361,923 1364,766 1348,664 1123,514" />
    </clipPath>
  </defs>
  <g transform="translate(0,300)">
    <ellipse class="shadow" id="shadow" cx="1000" cy="1335" rx="380" ry="40" fill="#6304"/>
    <g class="character">
      <g class="arm-left">
        <path id="arm-left-path" fill="none" stroke="black" stroke-width="36" d="M 720,917 C 622,938 532,998 535,1111" />
        <circle id="hand-2" cx="535" cy="1111" r="40" fill="#000"/>
      </g>
      <g class="arm-right">
        <path id="arm-right-path" fill="none" stroke="black" stroke-width="36" d="M 1459,1087 C 1444,992 1343,908 1272,900" />
        <circle id="hand-1" cx="1459" cy="1087" r="40" fill="#000"/>
      </g>
      <g class="leg-left">
        <path id="leg-left-path" fill="#000" d="M 851,1193 C 856,1259 841,1313 830,1331 878,1354 965,1352 995,1333 974,1283 899,1295 884,1307 898,1249 905,1154 905,1154" />
      </g>
      <g class="leg-right">
        <path id="leg-right-path" fill="#000" d="M 1081,1195 C 1085,1261 1070,1315 1060,1333 1108,1355 1195,1354 1225,1334 1204,1285 1129,1297 1114,1309 1127,1250 1135,1156 1135,1156" />
      </g>
      <path id="bowl" fill="#fed" stroke="black" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" d="M 860,544 C 599,655 614,874 635,977 656,1081 718,1174 817,1216 923,1217 1091,1213 1156,1213 1265,1180 1358,1081 1361,923 1364,766 1348,664 1123,514" />
      <path id="top" fill="#000" stroke-linecap="round" stroke-linejoin="round" d="M 793,572 C 793,572 793,503 791,503 691,494 659,512 616,545 572,578 550,665 548,700 547,734 550,781 548,832 547,883 494,902 490,823 485,743 502,565 551,505 601,445 682,442 751,440 820,439 1189,451 1243,452 1297,454 1330,494 1333,514 1336,533 1277,521 1259,536 1241,551 1217,583 1217,583 1217,583 793,572 793,572 Z" />
      <g class="liquid" clip-path="url(#bowl-clip)">
        <path id="coffee" fill="#630" stroke-linecap="round" stroke-linejoin="round" d="M 815,1190 C 758,1150 695,1090 677,1033 659,976 629,920 694,929 758,938 821,940 865,935 908,931 980,925 1036,940 1091,955 1177,943 1217,935 1258,928 1300,922 1318,934 1336,946 1340,959 1319,1018 1298,1076 1250,1162 1159,1186 1160,1184 815,1192 815,1190 Z" />
      </g>
      <path id="reflection-3" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" d="M 809,467 C 809,467 1171,476 1171,476" />
      <path id="reflection-2" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" d="M 556,542 C 572,508 610,470 694,464" />
      <path id="reflection-1" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" d="M 701,995 C 727,1075 785,1124 800,1135" />
      <path id="reflection-dark" fill="none" stroke="#000" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" d="M 664,833 C 677,769 712,697 731,677M 791,617 C 791,617 754,647 753,650" />
      <path id="smile" fill="none" stroke="black" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" d="M 1007,788 C 1010,841 1097,857 1111,787" />
      <g class="eyes">
        <ellipse id="eye-1" cx="940" cy="778" rx="35" ry="40" fill="#000"/>
        <ellipse id="eye-2" cx="1170" cy="778" rx="35" ry="40" fill="#000"/>
        <circle id="eye-1-reflection-1" cx="928" cy="762" r="13" fill="#fff"/>
        <circle id="eye-2-reflection-1" cx="1158" cy="762" r="13" fill="#fff"/>
        <circle id="eye-1-reflection-2" cx="920" cy="783" r="7" fill="#fff"/>
        <circle id="eye-2-reflection-2" cx="1150" cy="783" r="7" fill="#fff"/>
      </g>
    </g>
  </g>
</svg>
